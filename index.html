<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mobility Plan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0e;--bg2:#181817;--bg3:#222220;--bg4:#2a2a28;
  --border:#ffffff14;--border2:#ffffff22;
  --text:#f0eeea;--text2:#9f9f9b;--text3:#6b6b67;
  --accent:#c8f060;--accent-bg:#c8f06012;
  --red:#f87171;--red-bg:#f8717114;
  --amber:#fbbf24;--amber-bg:#fbbf2414;
  --r:10px;--r2:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;overflow:hidden}
button{font-family:inherit}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto}
.topbar{padding:16px 16px 0;flex-shrink:0}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;height:26px}
.app-title{font-family:'DM Mono',monospace;font-size:13px;color:var(--text3);letter-spacing:0.08em}
.today-btn{font-size:11px;color:var(--text3);padding:4px 10px;border-radius:20px;border:0.5px solid var(--border2);background:none;letter-spacing:.04em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.today-btn[hidden]{display:none}
.week-nav{display:flex;align-items:center;gap:6px;padding-bottom:12px}
.week-nav-btn{flex-shrink:0;width:28px;height:52px;border-radius:var(--r);border:0.5px solid var(--border);background:var(--bg2);color:var(--text3);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.week-nav-btn:active{border-color:var(--accent);color:var(--accent)}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;min-width:0}
.day-pill{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:var(--r);border:0.5px solid var(--border);background:var(--bg2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;color:inherit}
.day-pill.active{background:var(--accent);border-color:var(--accent)}
.day-pill.active .dp-name,.day-pill.active .dp-num{color:#0f0f0e}
.day-pill.is-today:not(.active){border-color:var(--border2)}
.day-pill.is-today:not(.active) .dp-num{color:var(--text)}
.dp-name{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.dp-num{font-size:15px;font-weight:500;color:var(--text2)}
.dp-dot{width:5px;height:5px;border-radius:50%;background:transparent}
.dp-dot.done{background:var(--accent)}
.dp-dot.partial{background:var(--text3)}
.dp-dot.min{background:var(--amber)}
.day-pill.active .dp-dot.done,.day-pill.active .dp-dot.partial,.day-pill.active .dp-dot.min{background:#0f0f0e}
.nav{display:flex;background:var(--bg2);border-top:0.5px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 4px 12px;font-size:10px;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase;letter-spacing:.05em;transition:color .15s;-webkit-tap-highlight-color:transparent}
.nav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-btn.active{color:var(--accent)}
.content{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 16px 24px}
.content::-webkit-scrollbar{display:none}
.screen{display:none}
.screen.active{display:block}
/* TODAY */
.hero{padding:12px 0 16px}
.hero-date{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:4px}
.hero-name{font-size:24px;font-weight:600;line-height:1.2;margin-bottom:8px}
.hero-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--accent-bg);color:var(--accent);font-weight:500}
.tag.muted{background:var(--bg3);color:var(--text2)}
.day-progress{margin-top:14px}
.day-progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px;font-family:'DM Mono',monospace;letter-spacing:.04em}
.bar-track{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.intro{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.55}
.banner{display:block;width:100%;text-align:left;font-size:13px;padding:12px 14px;border-radius:var(--r);background:var(--amber-bg);border:0.5px solid var(--amber);color:var(--amber);margin-bottom:14px;cursor:pointer}
.banner strong{font-weight:600}
.section-head{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 10px}
/* session card */
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r2);margin-bottom:12px;overflow:hidden;transition:border-color .2s}
.card.complete{border-color:var(--accent)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-head-main{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600}
.card-sub{font-size:12px;color:var(--text3);margin-top:1px}
.card-count{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);flex-shrink:0}
.card.complete .card-count{color:var(--accent)}
.card-arrow{font-size:12px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.card.open .card-arrow{transform:rotate(180deg)}
.card-bar{height:2px;background:var(--bg3)}
.card-bar div{height:100%;background:var(--accent);transition:width .3s}
.card-body{display:none;border-top:0.5px solid var(--border)}
.card.open .card-body{display:block}
.card-intro{font-size:12px;color:var(--text2);padding:10px 14px 0}
.block-label{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;padding:14px 14px 4px}
.ex{display:flex;gap:12px;padding:10px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;align-items:flex-start}
.ex + .ex{border-top:0.5px solid var(--border)}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s}
.cb svg{width:11px;height:11px;stroke:#0f0f0e;fill:none;stroke-width:2.5;display:none}
.ex.done .cb{background:var(--accent);border-color:var(--accent)}
.ex.done .cb svg{display:block}
.ex-main{flex:1;min-width:0}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-name{font-size:14px;font-weight:500}
.ex-dose{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);white-space:nowrap;flex-shrink:0}
.ex-cue{font-size:12px;color:var(--text3);margin-top:2px;line-height:1.45}
.ex.done .ex-name{color:var(--text2)}
.ex.ro{cursor:default}
.card-note{font-size:12px;color:var(--text2);padding:10px 14px;margin:4px 10px 10px;background:var(--bg3);border-radius:var(--r);line-height:1.5}
.card-actions{display:flex;justify-content:flex-end;padding:0 14px 12px}
.link-btn{font-size:12px;color:var(--text3);background:none;border:0.5px solid var(--border2);border-radius:20px;padding:4px 12px;cursor:pointer}
.link-btn:active{color:var(--accent);border-color:var(--accent)}
/* WEEK */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.stat{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:12px;text-align:center}
.stat-val{font-size:20px;font-weight:500;font-family:'DM Mono',monospace}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.wk-row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:inherit;-webkit-tap-highlight-color:transparent}
.wk-row.is-today{border-color:var(--border2)}
.wk-day{width:36px;flex-shrink:0;text-align:center}
.wk-day-name{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.wk-day-num{font-size:16px;font-weight:500;font-family:'DM Mono',monospace}
.wk-main{flex:1;min-width:0}
.wk-training{font-size:14px;font-weight:500}
.wk-mob{font-size:12px;color:var(--text3);margin-top:1px}
.wk-right{text-align:right;flex-shrink:0}
.wk-min{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2)}
.wk-status{font-size:11px;margin-top:2px;color:var(--text3)}
.wk-status.done{color:var(--accent)}
.wk-status.min{color:var(--amber)}
/* PLAN */
.prose{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.prio{display:flex;gap:12px;padding:12px 14px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px}
.prio-num{font-family:'DM Mono',monospace;color:var(--accent);font-size:13px;flex-shrink:0;padding-top:1px}
.prio-title{font-size:14px;font-weight:600;margin-bottom:2px}
.prio-text{font-size:13px;color:var(--text2);line-height:1.5}
table.sched{width:100%;border-collapse:collapse;font-size:12px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.sched th{text-align:left;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-size:10px;padding:8px 8px;border-bottom:0.5px solid var(--border2)}
.sched td{padding:8px;border-bottom:0.5px solid var(--border);vertical-align:top;color:var(--text2)}
.sched tr:last-child td{border-bottom:none}
.sched td:first-child{font-weight:600;color:var(--text)}
.sched td:last-child{font-family:'DM Mono',monospace;white-space:nowrap}
.fine{font-size:12px;color:var(--text3);margin:10px 0 0;line-height:1.5}
/* RULES */
.list-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r2);padding:4px 14px}
.list-card li{list-style:none;font-size:13px;color:var(--text2);padding:10px 0;line-height:1.5}
.list-card li + li{border-top:0.5px solid var(--border)}
.list-card.red{background:var(--red-bg);border-color:#f8717155}
.list-card.red li{color:var(--text)}
.list-card.red li + li{border-top-color:#f8717133}
.toggle-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;cursor:pointer}
.toggle-row + .toggle-row{border-top:0.5px solid var(--border)}
.switch{width:38px;height:22px;border-radius:11px;background:var(--bg4);position:relative;flex-shrink:0;transition:background .2s;margin-top:1px}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--text3);transition:all .2s}
.toggle-row.on .switch{background:var(--accent)}
.toggle-row.on .switch::after{left:19px;background:#0f0f0e}
.toggle-label{font-size:14px;font-weight:500}
.toggle-detail{font-size:12px;color:var(--text3);margin-top:2px}
.form-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:12px}
.field{margin-bottom:12px}
.field-label{font-size:13px;font-weight:500}
.field-how{font-size:12px;color:var(--text3);margin:1px 0 6px}
.field-marker{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-left:6px;font-weight:600}
input,select,textarea{width:100%;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg3);color:var(--text);border:0.5px solid var(--border2);border-radius:var(--r);padding:9px 11px;outline:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{height:64px;resize:vertical}
.btn-primary{width:100%;padding:13px;background:var(--accent);color:#0f0f0e;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer}
.btn-primary:active{opacity:.85}
.check-entry{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;font-size:13px}
.check-entry-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.check-entry-date{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3)}
.check-entry dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.check-entry dt{color:var(--text3);font-size:12px}
.check-entry dd{color:var(--text)}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;font-size:14px}
.del-btn:active{color:var(--red)}
.empty{font-size:13px;color:var(--text3);text-align:center;padding:16px 0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0f0f0e;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.footer-link{display:block;text-align:center;font-size:12px;color:var(--text3);margin-top:24px;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <span class="app-title">MOBILITY · HYBRID RUN</span>
      <button class="today-btn" id="today-btn" hidden>Today</button>
    </div>
    <div class="week-nav">
      <button class="week-nav-btn" id="prev-week" aria-label="Previous week">‹</button>
      <div class="week-strip" id="week-strip"></div>
      <button class="week-nav-btn" id="next-week" aria-label="Next week">›</button>
    </div>
  </div>

  <div class="content" id="content">
    <section class="screen active" id="screen-today"></section>
    <section class="screen" id="screen-week"></section>
    <section class="screen" id="screen-plan"></section>
    <section class="screen" id="screen-rules"></section>
  </div>

  <nav class="nav">
    <button class="nav-btn active" data-screen="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Today</button>
    <button class="nav-btn" data-screen="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
    <button class="nav-btn" data-screen="plan"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>Plan</button>
    <button class="nav-btn" data-screen="rules"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>Rules</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="mobility-data.js"></script>
<script>
// ── Storage ───────────────────────────────────────────────
function lsGet(k, d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k, v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// ── Dates ─────────────────────────────────────────────────
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LONG_DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayIdx(d){return (d.getDay()+6)%7}
function mondayOf(d){return addDays(startOfDay(d),-dayIdx(d))}
function sameDay(a,b){return iso(a)===iso(b)}
function isFirstSunday(d){return d.getDay()===0&&d.getDate()<=7}
function fmtShort(d){return MONTHS[d.getMonth()]+' '+d.getDate()}

let selected=startOfDay(new Date());
let screen='today';
let openCards={};          // routineKey -> bool, reset per selected date
let openDate=null;

// ── Plan helpers ──────────────────────────────────────────
function settings(){return lsGet('mob:settings',{})}
function items(rk){
  const s=settings();
  return ROUTINES[rk].items.map((it,i)=>Object.assign({id:rk+':'+i},it)).filter(it=>!it.when||s[it.when]);
}
function minutes(rk){
  const r=ROUTINES[rk],s=settings();
  if(r.minIf)for(const k in r.minIf)if(s[k])return r.minIf[k];
  return r.min;
}
function getDone(d){return lsGet('mob:done:'+iso(d),{})}
function setDone(d,obj){
  if(Object.keys(obj).length)lsSet('mob:done:'+iso(d),obj);
  else try{localStorage.removeItem('mob:done:'+iso(d))}catch(e){}
}
function progress(d,rk,done){
  done=done||getDone(d);
  const list=items(rk);
  const n=list.filter(it=>done[it.id]).length;
  return {n,total:list.length,complete:n===list.length};
}
function dayInfo(d){
  const day=WEEK[dayIdx(d)],done=getDone(d);
  let n=0,total=0,planned=0,doneMin=0;
  day.sessions.forEach(rk=>{
    const p=progress(d,rk,done);
    n+=p.n;total+=p.total;planned+=minutes(rk);doneMin+=minutes(rk)*p.n/p.total;
  });
  const anyDone=Object.keys(done).length>0;
  let status='';
  if(n===total)status='done';
  else if(progress(d,'minimum',done).complete)status='min';
  else if(anyDone)status='partial';
  return {n,total,planned,doneMin,status};
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const CHECK_SVG='<svg viewBox="0 0 12 12"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg>';

// ── Week strip ────────────────────────────────────────────
function renderStrip(){
  const mon=mondayOf(selected),today=startOfDay(new Date());
  let h='';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),st=dayInfo(d).status;
    const cls=['day-pill'];
    if(sameDay(d,selected))cls.push('active');
    if(sameDay(d,today))cls.push('is-today');
    h+=`<button class="${cls.join(' ')}" data-date="${iso(d)}"><span class="dp-name">${WEEK[i].day}</span><span class="dp-num">${d.getDate()}</span><span class="dp-dot ${st}"></span></button>`;
  }
  document.getElementById('week-strip').innerHTML=h;
  document.getElementById('today-btn').hidden=sameDay(selected,today);
}

// ── Routine card ──────────────────────────────────────────
function routineCard(rk,opts){
  opts=opts||{};
  const r=ROUTINES[rk],interactive=!opts.readonly;
  const done=interactive?getDone(selected):{};
  const list=items(rk),p=interactive?progress(selected,rk,done):null;
  const open=opts.readonly?false:openCards[rk];
  const cls=['card'];
  if(open)cls.push('open');
  if(p&&p.complete)cls.push('complete');
  let body='';
  if(r.intro)body+=`<div class="card-intro">${esc(r.intro)}</div>`;
  list.forEach(it=>{
    if(it.b)body+=`<div class="block-label">${esc(it.b)}</div>`;
    const isDone=!!done[it.id];
    body+=`<div class="ex${isDone?' done':''}${interactive?'':' ro'}"${interactive?` data-item="${it.id}"`:''}>`+
      (interactive?`<div class="cb">${CHECK_SVG}</div>`:'')+
      `<div class="ex-main"><div class="ex-top"><span class="ex-name">${esc(it.n)}</span><span class="ex-dose">${esc(it.d)}</span></div><div class="ex-cue">${esc(it.c)}</div></div></div>`;
  });
  if(r.note)body+=`<div class="card-note">${esc(r.note)}</div>`;
  if(interactive)body+=`<div class="card-actions"><button class="link-btn" data-all="${rk}">${p.complete?'Clear all':'Mark all done'}</button></div>`;
  const count=interactive?`<span class="card-count">${p.n}/${p.total}</span>`:'';
  const bar=interactive?`<div class="card-bar"><div style="width:${p.total?p.n/p.total*100:0}%"></div></div>`:'';
  return `<div class="card ${cls.slice(1).join(' ')}" data-card="${rk}${opts.readonly?':ro':''}">`+
    `<div class="card-head" data-toggle="${rk}${opts.readonly?':ro':''}"><div class="card-head-main"><div class="card-title">${esc(r.title)}</div><div class="card-sub">${esc(r.sub)} · ${minutes(rk)} min</div></div>${count}<span class="card-arrow">▾</span></div>`+
    bar+`<div class="card-body">${body}</div></div>`;
}

// ── Today ─────────────────────────────────────────────────
function renderToday(){
  const day=WEEK[dayIdx(selected)],info=dayInfo(selected);
  const extras=(day.extras||[]).concat(EXTRAS.filter(rk=>day.sessions.indexOf(rk)<0));
  if(openDate!==iso(selected)){
    openDate=iso(selected);openCards={};
    const done=getDone(selected);
    // open the first unfinished scheduled routine
    const next=day.sessions.find(rk=>!progress(selected,rk,done).complete);
    if(next)openCards[next]=true;
  }
  const today=startOfDay(new Date());
  const rel=sameDay(selected,today)?'Today':sameDay(selected,addDays(today,1))?'Tomorrow':sameDay(selected,addDays(today,-1))?'Yesterday':'';
  let h=`<div class="hero"><div class="hero-date">${rel?rel.toUpperCase()+' · ':''}${LONG_DAYS[dayIdx(selected)].toUpperCase()} ${fmtShort(selected).toUpperCase()}</div>`+
    `<div class="hero-name">${esc(day.name)}</div>`+
    `<div class="hero-meta"><span class="tag">${esc(day.training)}</span><span class="tag muted">${info.planned} min mobility</span></div>`+
    `<div class="day-progress"><div class="day-progress-label"><span>${info.n}/${info.total} DONE</span><span>${info.status==='done'?'COMPLETE':info.status==='min'?'MINIMUM DONE':''}</span></div><div class="bar-track"><div class="bar-fill" style="width:${info.total?info.n/info.total*100:0}%"></div></div></div></div>`;
  if(isFirstSunday(selected))h+=`<button class="banner" data-goto="rules"><strong>Monthly check today.</strong> Test your three markers and log them →</button>`;
  if(day.intro)h+=`<p class="intro">${esc(day.intro)}</p>`;
  day.sessions.forEach(rk=>{h+=routineCard(rk)});
  h+=`<div class="section-head">Extras</div>`;
  extras.forEach(rk=>{h+=routineCard(rk)});
  document.getElementById('screen-today').innerHTML=h;
}

// ── Week ──────────────────────────────────────────────────
function renderWeek(){
  const mon=mondayOf(selected),today=startOfDay(new Date());
  let planned=0,doneMin=0,daysDone=0,rows='';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),day=WEEK[i],info=dayInfo(d);
    planned+=info.planned;doneMin+=info.doneMin;if(info.status==='done')daysDone++;
    const label=info.status==='done'?'Done':info.status==='min'?'Minimum':info.n?`${info.n}/${info.total}`:'';
    rows+=`<button class="wk-row${sameDay(d,today)?' is-today':''}" data-open="${iso(d)}">`+
      `<div class="wk-day"><div class="wk-day-name">${day.day}</div><div class="wk-day-num">${d.getDate()}</div></div>`+
      `<div class="wk-main"><div class="wk-training">${esc(day.training)}</div><div class="wk-mob">${day.sessions.map(rk=>esc(ROUTINES[rk].title)).join(' + ')}</div></div>`+
      `<div class="wk-right"><div class="wk-min">${day.sessions.map(minutes).join(' + ')} min</div><div class="wk-status ${info.status}">${label}</div></div></button>`;
  }
  const h=`<div class="hero" style="padding-bottom:4px"><div class="hero-date">WEEK OF ${fmtShort(mon).toUpperCase()}</div><div class="hero-name">This week</div></div>`+
    `<div class="summary"><div class="stat"><div class="stat-val">${daysDone}/7</div><div class="stat-lbl">Days done</div></div>`+
    `<div class="stat"><div class="stat-val">${Math.round(doneMin)}</div><div class="stat-lbl">Min done</div></div>`+
    `<div class="stat"><div class="stat-val">${planned}</div><div class="stat-lbl">Min planned</div></div></div>`+rows;
  document.getElementById('screen-week').innerHTML=h;
}

// ── Plan ──────────────────────────────────────────────────
function renderPlan(){
  let h=`<div class="hero" style="padding-bottom:8px"><div class="hero-date">${esc(PLAN_META.date.toUpperCase())}</div><div class="hero-name">${esc(PLAN_META.title)}</div></div>`;
  h+=`<p class="prose">${esc(PLAN_META.intro)}</p>`;
  PLAN_META.priorities.forEach((p,i)=>{h+=`<div class="prio"><span class="prio-num">${i+1}</span><div><div class="prio-title">${esc(p[0])}</div><div class="prio-text">${esc(p[1])}</div></div></div>`});
  h+=`<div class="section-head">How the week works</div><table class="sched"><thead><tr><th>Day</th><th>Training</th><th>Mobility</th><th>Min</th></tr></thead><tbody>`;
  WEEK.forEach(day=>{h+=`<tr><td>${day.day}</td><td>${esc(day.training)}</td><td>${day.sessions.map(rk=>esc(ROUTINES[rk].title)).join(', ')}</td><td>${day.sessions.map(minutes).join(' + ')}</td></tr>`});
  h+=`</tbody></table><p class="fine">${esc(PLAN_META.assumption)}</p>`;
  const groups=[
    ['Lift days',['preLiftA','postLiftA','preLiftB','postLiftB']],
    ['Run days',['preRun','postRun']],
    ['Mobility sessions',['session1','session2']],
    ['Golf',['preRound','range']],
    ['Short on time',['minimum','qlAddon']]
  ];
  groups.forEach(g=>{
    h+=`<div class="section-head">${g[0]}</div>`;
    g[1].forEach(rk=>{h+=routineCard(rk,{readonly:true})});
  });
  document.getElementById('screen-plan').innerHTML=h;
}

// ── Rules + monthly check ────────────────────────────────
function renderRules(){
  const s=settings(),checks=lsGet('mob:checks',[]);
  let h=`<div class="hero" style="padding-bottom:8px"><div class="hero-name">Rules & progress</div></div>`;
  h+=`<div class="section-head" style="margin-top:4px">Rules</div><ul class="list-card">${RULES.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`;
  h+=`<div class="section-head">Progression as mileage builds</div><div class="list-card" style="padding:0 14px">`;
  PROGRESSIONS.forEach(p=>{h+=`<div class="toggle-row${s[p.key]?' on':''}" data-setting="${p.key}"><div class="switch"></div><div><div class="toggle-label">${esc(p.label)}</div><div class="toggle-detail">${esc(p.detail)}</div></div></div>`});
  h+=`</div><p class="fine">${esc(PROGRESSION_NOTE)}</p>`;
  h+=`<div class="section-head">Monthly check · first Sunday</div><form class="form-card" id="check-form">`;
  h+=`<div class="field"><div class="field-label">Date</div><input type="date" name="date" value="${iso(startOfDay(new Date()))}"></div>`;
  MONTHLY_CHECKS.forEach(c=>{h+=`<div class="field"><div class="field-label">${esc(c.label)}<span class="field-marker">${esc(c.marker)}</span></div><div class="field-how">${esc(c.how)}</div><input type="text" name="${c.key}" placeholder="${esc(c.ph)}" autocomplete="off"></div>`});
  h+=`<div class="field"><div class="field-label">Notes</div><textarea name="notes"></textarea></div><button type="submit" class="btn-primary">Save check</button></form>`;
  if(checks.length){
    checks.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(c=>{
      h+=`<div class="check-entry"><div class="check-entry-top"><span class="check-entry-date">${esc(c.date)}</span><button class="del-btn" data-del-check="${esc(c.id)}" aria-label="Delete">✕</button></div><dl>`+
        MONTHLY_CHECKS.map(m=>c[m.key]?`<dt>${esc(m.marker.replace(' marker',''))}</dt><dd>${esc(c[m.key])}</dd>`:'').join('')+
        (c.notes?`<dt>Notes</dt><dd>${esc(c.notes)}</dd>`:'')+`</dl></div>`;
    });
  } else h+=`<div class="empty">No checks logged yet.</div>`;
  h+=`<div class="section-head">Red flags · stop and see a physio</div><ul class="list-card red">${RED_FLAGS.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`;
  h+=`<a class="footer-link" href="archive/">Old training tracker →</a>`;
  document.getElementById('screen-rules').innerHTML=h;
}

// ── Render + navigation ───────────────────────────────────
function render(){
  renderStrip();
  if(screen==='today')renderToday();
  else if(screen==='week')renderWeek();
  else if(screen==='plan')renderPlan();
  else renderRules();
}
function showScreen(name){
  screen=name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+name));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));
  document.getElementById('content').scrollTop=0;
  render();
}
function selectDate(d,goToday){
  selected=startOfDay(d);
  if(goToday&&screen!=='today')showScreen('today');
  else{render();if(screen==='today')document.getElementById('content').scrollTop=0}
}
function parseIso(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}

document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('.nav-btn');if(b)showScreen(b.dataset.screen)});
document.getElementById('week-strip').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(b)selectDate(parseIso(b.dataset.date),true)});
document.getElementById('prev-week').addEventListener('click',()=>selectDate(addDays(selected,-7)));
document.getElementById('next-week').addEventListener('click',()=>selectDate(addDays(selected,7)));
document.getElementById('today-btn').addEventListener('click',()=>selectDate(new Date(),true));

document.getElementById('content').addEventListener('click',e=>{
  const t=e.target;
  const item=t.closest('[data-item]');
  if(item){
    const done=getDone(selected),id=item.dataset.item;
    if(done[id])delete done[id];else done[id]=1;
    setDone(selected,done);
    const rk=id.split(':')[0];
    // collapse a finished scheduled routine and open the next one
    if(progress(selected,rk,done).complete){
      const day=WEEK[dayIdx(selected)];
      openCards[rk]=false;
      const idx=day.sessions.indexOf(rk);
      if(idx>=0){const nxt=day.sessions.slice(idx+1).find(k=>!progress(selected,k,done).complete);if(nxt)openCards[nxt]=true}
      toast(ROUTINES[rk].title+' done');
    }
    render();return;
  }
  const all=t.closest('[data-all]');
  if(all){
    const rk=all.dataset.all,done=getDone(selected),list=items(rk);
    const complete=progress(selected,rk,done).complete;
    list.forEach(it=>{if(complete)delete done[it.id];else done[it.id]=1});
    setDone(selected,done);
    if(!complete){openCards[rk]=false;toast(ROUTINES[rk].title+' done')}
    render();return;
  }
  const tog=t.closest('[data-toggle]');
  if(tog){
    const card=tog.closest('.card');
    const key=tog.dataset.toggle;
    const isOpen=!card.classList.contains('open');
    card.classList.toggle('open',isOpen);
    if(key.indexOf(':ro')<0)openCards[key]=isOpen;
    return;
  }
  const row=t.closest('[data-open]');
  if(row){selectDate(parseIso(row.dataset.open),true);return}
  const go=t.closest('[data-goto]');
  if(go){showScreen(go.dataset.goto);return}
  const set=t.closest('[data-setting]');
  if(set){const s=settings();s[set.dataset.setting]=!s[set.dataset.setting];lsSet('mob:settings',s);render();return}
  const del=t.closest('[data-del-check]');
  if(del){
    if(!confirm('Delete this check?'))return;
    lsSet('mob:checks',lsGet('mob:checks',[]).filter(c=>c.id!==del.dataset.delCheck));
    render();return;
  }
});
document.getElementById('content').addEventListener('submit',e=>{
  if(e.target.id!=='check-form')return;
  e.preventDefault();
  const f=new FormData(e.target),entry={id:String(Date.now()),date:f.get('date')||iso(new Date())};
  MONTHLY_CHECKS.forEach(c=>{entry[c.key]=(f.get(c.key)||'').trim()});
  entry.notes=(f.get('notes')||'').trim();
  if(!MONTHLY_CHECKS.some(c=>entry[c.key])&&!entry.notes){toast('Nothing to save');return}
  const checks=lsGet('mob:checks',[]);checks.push(entry);lsSet('mob:checks',checks);
  toast('Check saved');render();
});

// If the app is left open past midnight, follow "today" to the new date
let lastToday=iso(startOfDay(new Date()));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const now=iso(startOfDay(new Date()));
  if(now!==lastToday&&iso(selected)===lastToday)selected=startOfDay(new Date());
  lastToday=now;render();
});

render();
</script>
